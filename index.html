<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="使用交互色盘选择基准色，通过自定义色块数量和色相偏移角度生成配色方案。"
    />
    <meta name="theme-color" content="#f7f7f2" />
    <title>偏色 · 色相配色工具</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#" aria-label="偏色首页">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span>偏色</span>
      </a>
      <p>HUE SHIFT STUDIO</p>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> 色相偏移配色工具</p>
        <h1 id="page-title">让色彩，<em>自然成组。</em></h1>
        <p class="hero-copy">
          从一个颜色出发，用等距色相偏移探索和谐、有节奏的配色方案。
        </p>
      </section>

      <section class="studio" aria-label="配色工作台">
        <aside class="control-panel">
          <div class="section-heading">
            <div>
              <span class="step">01</span>
              <h2>选择基准色</h2>
            </div>
            <span class="status-dot">拖动色盘</span>
          </div>

          <div class="wheel-wrap">
            <canvas
              id="color-wheel"
              width="320"
              height="320"
              tabindex="0"
              role="slider"
              aria-label="色相与饱和度色盘"
              aria-valuemin="0"
              aria-valuemax="359"
              aria-valuenow="222"
              aria-describedby="wheel-help"
            ></canvas>
            <span id="wheel-pointer" class="wheel-pointer" aria-hidden="true"></span>
          </div>
          <p id="wheel-help" class="sr-only">
            使用左右方向键调整色相，按住 Shift 并使用上下方向键调整饱和度。
          </p>

          <div class="selected-color">
            <label for="base-color">
              <span class="selected-label">当前颜色</span>
              <span class="native-picker">
                <input id="base-color" type="color" value="#4f70e8" />
                <span>打开系统色盘</span>
              </span>
            </label>
            <div class="color-value">
              <span id="base-preview" aria-hidden="true"></span>
              <strong id="base-hex">#4F70E8</strong>
            </div>
          </div>

          <div class="divider"></div>

          <div class="section-heading settings-heading">
            <div>
              <span class="step">02</span>
              <h2>设置偏移规则</h2>
            </div>
          </div>

          <div class="field-group">
            <div class="field-title">
              <label for="lightness-range">明度</label>
              <output id="lightness-output" for="lightness-range">61%</output>
            </div>
            <input
              id="lightness-range"
              class="range"
              type="range"
              min="20"
              max="80"
              value="61"
            />
          </div>

          <div class="field-group">
            <div class="field-title">
              <label for="count-range">色块数量</label>
              <div class="number-unit">
                <input id="count-number" type="number" min="2" max="12" value="6" />
                <span>块</span>
              </div>
            </div>
            <input
              id="count-range"
              class="range"
              type="range"
              min="2"
              max="12"
              value="6"
            />
            <div class="range-scale" aria-hidden="true"><span>2</span><span>12</span></div>
          </div>

          <div class="field-group">
            <div class="field-title">
              <label for="offset-range">偏移角度</label>
              <div class="number-unit">
                <input id="offset-number" type="number" min="1" max="180" value="30" />
                <span>°</span>
              </div>
            </div>
            <input
              id="offset-range"
              class="range"
              type="range"
              min="1"
              max="180"
              value="30"
            />
            <div class="angle-presets" aria-label="常用偏移角度">
              <button type="button" data-angle="15">15°</button>
              <button type="button" data-angle="30" class="active">30°</button>
              <button type="button" data-angle="45">45°</button>
              <button type="button" data-angle="60">60°</button>
              <button type="button" data-angle="120">120°</button>
            </div>
          </div>
        </aside>

        <section class="preview-panel" aria-labelledby="palette-title">
          <div class="preview-heading">
            <div>
              <p class="preview-kicker">LIVE PREVIEW</p>
              <h2 id="palette-title">你的偏移色组</h2>
            </div>
            <div class="palette-rule">
              <span id="rule-count">6 色</span>
              <i></i>
              <span id="rule-angle">每次 +30°</span>
            </div>
          </div>

          <div id="palette-strip" class="palette-strip" aria-hidden="true"></div>
          <div id="swatch-grid" class="swatch-grid" aria-live="polite"></div>

          <div class="preview-note">
            <span class="note-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 2a7 7 0 0 0-4.2 12.6c.7.5 1.2 1.2 1.2 2V17h6v-.4c0-.8.5-1.5 1.2-2A7 7 0 0 0 12 2Z"></path>
                <path d="M9 21h6M9 18h6"></path>
              </svg>
            </span>
            <p>
              <strong>点击任意色块复制 HEX 色值</strong>
              色相环每圈为 360°，所有色块保留基准色的饱和度与明度。
            </p>
          </div>
        </section>
      </section>
    </main>

    <footer>
      <p>基于 HSL 色彩模型</p>
      <p>HUE · SATURATION · LIGHTNESS</p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
